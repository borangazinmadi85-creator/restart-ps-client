services:
  - type: web
    name: restart-playstation-club
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: OWNER_LOGIN
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: restart-postgres
          property: connectionString
databases:
  - name: restart-postgres
    databaseName: restart
    user: restart
